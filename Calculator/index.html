<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    <div class="cal-body">
        <div class="cal-input">
        <input type="text" maxlength="10">
        </div>
        <div>
            <input type="button" class="card" value="C">
            <input type="button" class="card" value="+/-">
            <input type="button" class="card" value="%">
            <input type="button" class="card btn" value="/">
        </div>
        <div>
            <input type="button" class="card" value="7">
            <input type="button" class="card" value="8">
            <input type="button" class="card" value="9">
            <input type="button" class="card btn" value="X">
        </div>
        <div>
            <input type="button" class="card" value="4">
            <input type="button" class="card" value="5">
            <input type="button" class="card" value="6">
            <input type="button" class="card btn" value="-">
        </div>
        <div>
            <input type="button" class="card" value="1">
            <input type="button" class="card" value="2">
            <input type="button" class="card" value="3">
            <input type="button" class="card btn" value="+">
        </div>
        <div>
            <input type="button" class="card" value="0">
            <input type="button" class="card" value=".">
            <input type="button" class="card" value="DEL">
            <input type="button" class="card sum" value="=">
        </div>
    </div>
</body>
</html>
